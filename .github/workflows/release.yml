name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt

      - name: Validate tag and package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH; received: $tag" >&2
            exit 1
          fi

          package_version=$(cargo metadata \
            --manifest-path package/Cargo.toml \
            --locked \
            --format-version 1 \
            | jq -r '.packages[] | select(.name == "signal-tui") | .version')

          if [[ "v${package_version}" != "$tag" ]]; then
            echo "Tag $tag does not match package version v${package_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --manifest-path package/Cargo.toml --all -- --check

      - name: Run tests
        run: cargo test --manifest-path package/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path package/Cargo.toml --locked --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: >-
          cargo build
          --manifest-path package/Cargo.toml
          --locked
          --release
          --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "package/target/${{ matrix.target }}/release/signal" \
            "dist/signal-${{ matrix.target }}"
          chmod 0755 "dist/signal-${{ matrix.target }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/signal-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          sha256sum signal-* > SHA256SUMS

          version="${GITHUB_REF_NAME#v}"
          checksum() {
            local asset="$1"
            local value
            value=$(awk -v asset="$asset" '$2 == asset { print $1 }' SHA256SUMS)
            if [[ -z "$value" ]]; then
              echo "Missing checksum for $asset" >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          jq -n \
            --arg version "$version" \
            --arg x86_64_apple "$(checksum signal-x86_64-apple-darwin)" \
            --arg aarch64_apple "$(checksum signal-aarch64-apple-darwin)" \
            --arg x86_64_linux "$(checksum signal-x86_64-unknown-linux-gnu)" \
            --arg aarch64_linux "$(checksum signal-aarch64-unknown-linux-gnu)" \
            '{
              schema: 1,
              version: $version,
              artifacts: {
                "x86_64-apple-darwin": {
                  name: "signal-x86_64-apple-darwin",
                  sha256: $x86_64_apple
                },
                "aarch64-apple-darwin": {
                  name: "signal-aarch64-apple-darwin",
                  sha256: $aarch64_apple
                },
                "x86_64-unknown-linux-gnu": {
                  name: "signal-x86_64-unknown-linux-gnu",
                  sha256: $x86_64_linux
                },
                "aarch64-unknown-linux-gnu": {
                  name: "signal-aarch64-unknown-linux-gnu",
                  sha256: $aarch64_linux
                }
              }
            }' > release.json

      - name: Verify release manifest
        working-directory: dist
        shell: bash
        run: |
          test "$(jq -r '.schema' release.json)" = "1"
          test "$(jq -r '.version' release.json)" = "${GITHUB_REF_NAME#v}"
          for asset in signal-*; do
            target="${asset#signal-}"
            manifest_name=$(jq -r --arg target "$target" '.artifacts[$target].name // empty' release.json)
            manifest_checksum=$(jq -r --arg target "$target" '.artifacts[$target].sha256 // empty' release.json)
            actual_checksum=$(sha256sum "$asset" | awk '{ print $1 }')
            test "$manifest_name" = "$asset"
            test "$manifest_checksum" = "$actual_checksum"
          done
          test "$(jq '.artifacts | length' release.json)" = "4"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/signal-*
          dist/SHA256SUMS
          dist/release.json
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
