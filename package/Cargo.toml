[package]
name = "signal-tui"
version = "0.3.6"
edition = "2021"
license = "MIT"
description = "A fast, keyboard-first Signal client for the terminal"
repository = "https://github.com/emilianscheel/signal-cli"

[[bin]]
name = "signal"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6.0"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2"
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.94.4", features = ["json"] }
presage = { git = "https://github.com/emilianscheel/presage", rev = "17a96cb49fb0b9c7acd52fd3125d329224502305" }
presage-store-sqlite = { git = "https://github.com/emilianscheel/presage", rev = "17a96cb49fb0b9c7acd52fd3125d329224502305" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
qrcode = { version = "0.14", default-features = false }
ratatui = "0.29"
ratatui-image = { version = "5.0", default-features = false, features = ["crossterm"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
url = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
